# docker-compose.yml
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "80" # Expose port 80 internally to the Docker network
    environment:
      # Optional: Trust the Nginx proxy to handle IP forwarding properly
      FORWARDED_ALLOW_IPS: "*" 

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80" # Map the container's port 80 to the host's port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
